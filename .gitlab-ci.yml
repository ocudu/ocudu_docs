spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
    ocudu_oran_apps_path:
      type: string
      default: ocudu/ocudu_elements/ocudu_oran_apps
      description: "OCUDU ORAN Apps reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/workflow.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/static.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/gitlab_settings/.gitlab-ci.yml
    inputs:
      ocudu_path: $[[ inputs.ocudu_path ]]
      ocudu_ref: $[[ inputs.ocudu_ref ]]

stages:
  - ci
  - test
  - build
  - publish

variables:
  # Sections included in the generated PDFs. Shared by generate-pdf (which
  # renders one PDF per entry plus a full-site PDF) and build/pages (which pull
  # the matching PDFs from the package registry into static/pdf/). Keep the
  # slugs here in sync with any per-section download links added to the site.
  PDF_SECTIONS: "user_manual/,tutorials/,knowledge_base/,dev_guide/,integrations/,releases/"

lint-and-test:
  stage: ci
  image: node:20
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH
  script:
    - npm ci
    - npm run lint
    - npm test

headers:
  stage: ci
  extends: .headers
  variables:
    IGNORE_PATH: docs/user_manual

get_ocudu_project_id:
  stage: .pre
  image: alpine:3
  before_script:
    - apk add --no-cache curl jq
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /PDF/
  script:
    # Fetch project details using GitLab API and extract the project ID
    - |
      PROJECT_PATH_ENCODED=$(echo "$[[ inputs.ocudu_path ]]" | sed 's/\//%2F/g')
      OCUDU_PROJECT_ID=$(curl --silent --fail --show-error \
        "${CI_API_V4_URL}/projects/${PROJECT_PATH_ENCODED}" | jq -r '.id')
      echo "OCUDU_PROJECT_ID=${OCUDU_PROJECT_ID}" >> build.env
      echo "OCUDU Project ID: ${OCUDU_PROJECT_ID}"
  artifacts:
    reports:
      dotenv: build.env

build:
  stage: test
  image: node:20
  needs:
    - job: get_ocudu_project_id
      artifacts: true
  rules:
    - if: $ON_MR
      variables:
        BASE_URL: /-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public/
  script:
    # Setup
    - npm install
    ## Git clone OCUDU repos
    - git clone -b $[[ inputs.ocudu_ref ]] ${CI_SERVER_URL}/$[[ inputs.ocudu_path ]].git docs/ocudu
    - mkdir -p docs/oran_apps
    - git clone ${CI_SERVER_URL}/$[[ inputs.ocudu_oran_apps_path ]]/ocudu_netconf.git oran_apps/ocudu_netconf
    - git clone ${CI_SERVER_URL}/$[[ inputs.ocudu_oran_apps_path ]]/ocudu_o1_adapter.git oran_apps/ocudu_o1_adapter
    ## Static
    - mkdir -p static/coverage static/doxygen
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" ${CI_API_V4_URL}/projects/${OCUDU_PROJECT_ID}/packages/generic/coverage_html/latest/coverage_html.tar.gz -o coverage_html.tar.gz
      tar -xzf coverage_html.tar.gz -C static/coverage --strip-components=1
      rm -f coverage_html.tar.gz
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" ${CI_API_V4_URL}/projects/${OCUDU_PROJECT_ID}/packages/generic/doxygen/latest/doxygen.tar.gz -o doxygen.tar.gz
      tar -xzf doxygen.tar.gz -C static/doxygen --strip-components=4
      rm -f doxygen.tar.gz
    ## PDFs: pull the latest generated PDFs from the package registry into
    ## static/pdf/ so they are served from the site root at /pdf/<name>.pdf.
    ## The || skip keeps the build green before the first PDF schedule has run.
    - |
      mkdir -p static/pdf
      slugify() { echo "$1" | sed 's#/*$##; s#/#-#g; s#_#-#g'; }
      PDF_FILES="ocudu-docs.pdf"
      for section in $(echo "$PDF_SECTIONS" | tr ',' ' '); do
        [ -z "$section" ] && continue
        PDF_FILES="$PDF_FILES ocudu-$(slugify "$section").pdf"
      done
      for f in $PDF_FILES; do
        if curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docs_pdf/latest/$f" \
          -o "static/pdf/$f"; then
          echo "Pulled $f"
        else
          echo "$f not published yet, skipping"
          rm -f "static/pdf/$f"
        fi
      done
    # Build the Docusaurus site
    - npm run build
    # Move built site to public folder
    - mv build public
  after_script:
    - |
      echo "*******************************************************************************************************************************"
      echo "https://${CI_PROJECT_NAMESPACE_SLUG}.${CI_PAGES_DOMAIN}/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public/index.html"
      echo "*******************************************************************************************************************************"
  artifacts:
    paths:
      - public
    expire_in: 1 day

pages:
  extends: build
  stage: build
  environment:
    name: pages
    url: $CI_PAGES_URL
  rules:
    - if: $ON_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  after_script:
    - |
      echo "*******************************************************************************************************************************"
      echo "Deployed to Pages: ${CI_PAGES_URL}"
      echo "*******************************************************************************************************************************"

generate-pdf:
  stage: publish
  image: node:20
  variables:
    PUPPETEER_SKIP_DOWNLOAD: "true"
  needs:
    - job: get_ocudu_project_id
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /PDF/
  before_script:
    # Install Chromium and dependencies required by Puppeteer
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      chromium
      fonts-liberation
      libatk-bridge2.0-0
      libatk1.0-0
      libcups2
      libdrm2
      libgbm1
      libnss3
      libxdamage1
      libxkbcommon0
      > /dev/null
    - rm -rf /var/lib/apt/lists/*
  script:
    # Build the Docusaurus site (same as the build job)
    - npm install
    - git clone -b $[[ inputs.ocudu_ref ]] ${CI_SERVER_URL}/$[[ inputs.ocudu_path ]].git docs/ocudu
    - mkdir -p docs/oran_apps
    - git clone ${CI_SERVER_URL}/$[[ inputs.ocudu_oran_apps_path ]]/ocudu_netconf.git oran_apps/ocudu_netconf
    - git clone ${CI_SERVER_URL}/$[[ inputs.ocudu_oran_apps_path ]]/ocudu_o1_adapter.git oran_apps/ocudu_o1_adapter
    - mkdir -p static/coverage static/doxygen
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" ${CI_API_V4_URL}/projects/${OCUDU_PROJECT_ID}/packages/generic/coverage_html/latest/coverage_html.tar.gz -o coverage_html.tar.gz
      tar -xzf coverage_html.tar.gz -C static/coverage --strip-components=1
      rm -f coverage_html.tar.gz
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" ${CI_API_V4_URL}/projects/${OCUDU_PROJECT_ID}/packages/generic/doxygen/latest/doxygen.tar.gz -o doxygen.tar.gz
      tar -xzf doxygen.tar.gz -C static/doxygen --strip-components=4
      rm -f doxygen.tar.gz
    - npm run build
    - mv build public
    # Install docs-to-pdf plus puppeteer-core (used by scripts/prepare-pdf-html.js)
    # after the site build to avoid dependency conflicts. puppeteer-core skips
    # the bundled Chromium download — the job installs system Chromium instead.
    - npm install --no-save docs-to-pdf@1 serve@14 puppeteer-core@23
    # Serve the built site in the background. The PDF-prep step below needs the
    # site served so it can load each page with JS in Chromium (see below).
    - npx serve public -l 3000 &
    - |
      echo "Waiting for server on port 3000..."
      for i in $(seq 1 30); do
        if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
          echo "Server ready after ${i}s"
          break
        fi
        sleep 1
      done
    # Prepare the built HTML for PDF rendering. Loads each page WITH JS in
    # Chromium so Mermaid diagrams render to inline SVG, then expands tab panels
    # and injects per-panel labels on the live DOM, and writes the fully-rendered
    # static HTML back. This keeps both fixes: rendered diagrams AND expanded
    # tabs. (Replaces the earlier JS-stripping approach, which broke Mermaid
    # because the diagrams are drawn client-side — see MR !83 review.)
    - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium node scripts/prepare-pdf-html.js http://localhost:3000 public
    # Render PDFs from the prepared static HTML. We produce one full-site PDF
    # plus one PDF per section listed in PDF_SECTIONS. The tab bar is hidden and
    # panels are bordered for visual separation (also reinforced via --cssStyle).
    - |
      mkdir -p pdf
      COMMIT=$(git rev-parse --short HEAD)
      DATE=$(date -u +%Y-%m-%d)

      # Turn a section path (e.g. "user_manual/installation/") into a filename
      # slug ("user-manual-installation") and a human title ("User Manual Installation").
      slugify() { echo "$1" | sed 's#/*$##; s#/#-#g; s#_#-#g'; }
      titleize() { echo "$1" | sed 's#/*$##; s#[/_]# #g' | sed 's/\b\(.\)/\u\1/g'; }

      render_pdf() {
        # $1 = comma-separated initial URLs, $2 = output file, $3 = cover title,
        # $4 = optional extra docs-to-pdf flags (e.g. --restrictPaths).
        # --baseUrl rewrites the site's relative links to the live docs domain so
        # links in the PDF point at docs.ocudu.org rather than the localhost build
        # server the render runs against.
        PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium \
        npx docs-to-pdf docusaurus \
          --initialDocURLs="$1" \
          --baseUrl="https://docs.ocudu.org/" \
          --contentSelector="article" \
          --coverTitle="$3" \
          --coverSub="Generated $DATE from $COMMIT" \
          --paperFormat="A4" \
          --outputPDFFilename="$2" \
          --excludePaths="/coverage/,/doxygen/,/qa_results/" \
          --excludeSelectors=".theme-doc-footer,nav.pagination-nav,.table-of-contents" \
          --cssStyle="ul[role='tablist']{display:none !important;} div[role='tabpanel']{border:1px solid #dee2e6; padding:12px 16px; margin-bottom:1rem; border-radius:4px; page-break-inside:auto;}" \
          --puppeteerArgs="--no-sandbox,--disable-gpu,--disable-dev-shm-usage" \
          --protocolTimeout=300000 \
          --version=3 \
          $4
      }

      # Full-site PDF: every section, one document. No --restrictPaths here so
      # the crawl is free to follow pagination across the whole site.
      FULL_URLS=$(echo "$PDF_SECTIONS" | tr ',' '\n' | sed 's|.*|http://localhost:3000/&|' | tr '\n' ',' | sed 's/,$//')
      render_pdf "$FULL_URLS" "pdf/ocudu-docs.pdf" "OCUDU Documentation"

      # Per-section PDFs. Each starts from a single section URL and passes
      # --restrictPaths so docs-to-pdf includes only pages under that path. Without
      # it, the pagination crawl runs past the end of the section and pulls in
      # whatever comes next in the sidebar (e.g. the User Manual PDF picking up
      # Tutorials/Integrations pages). --disableTOC drops the auto-generated
      # contents page: these section PDFs are small enough that the PDF reader's
      # bookmark panel is enough, and the full-site PDF above keeps its TOC where
      # a contents page actually helps. See MR !83 review.
      echo "$PDF_SECTIONS" | tr ',' '\n' | while read -r section; do
        [ -z "$section" ] && continue
        slug=$(slugify "$section")
        title=$(titleize "$section")
        render_pdf "http://localhost:3000/$section" "pdf/ocudu-$slug.pdf" "OCUDU $title" "--restrictPaths --disableTOC"
      done

      echo "Generated PDFs:"
      ls -lh pdf/
    # Stop the background server
    - kill %1 2>/dev/null || true
    # Publish every generated PDF to the generic package registry under
    # docs_pdf/latest/, the same pattern used for coverage_html and doxygen.
    # The build/pages jobs pull these into static/pdf/ so they are downloadable
    # from the deployed site.
    - |
      for f in pdf/*.pdf; do
        name=$(basename "$f")
        echo "Publishing $name to package registry..."
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docs_pdf/latest/$name"
      done
  artifacts:
    paths:
      - pdf/
    expire_in: 30 days
