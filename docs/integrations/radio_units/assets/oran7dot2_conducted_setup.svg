 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#7999ef"/><stop offset="1" stop-color="#5274cf"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#eef0f4"/><stop offset="1" stop-color="#c9cdd4"/></linearGradient>
