<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1244" viewBox="62 3 1500 1244" role="img" aria-labelledby="title desc">
<title id="title">GPS-synchronized RAN with spectrum analyzer</title>
<desc id="desc">A GPS satellite sends a signal to a GPS antenna connected to a switch with a PTP grandmaster. The switch connects to a radio unit and a RAN server through links labeled OFH + PTP. The radio unit has four antenna ports. Antenna port 1 connects through a small attenuator and an RF cable to a spectrum analyzer displaying an ideal 64-QAM constellation with 64 points in an eight-by-eight grid.</desc>
