<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1196" viewBox="62 51 1500 1196" role="img" aria-labelledby="title desc">
<title id="title">GPS-synchronized RAN architecture</title>
<desc id="desc">A GPS satellite sends a signal to a GPS antenna connected to a switch with a PTP grandmaster. The switch connects to a radio unit and a RAN server through links labeled OFH + PTP. The radio unit has a wireless connection to user equipment, labeled UE.</desc>
<defs>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#7999ef"/><stop offset="1" stop-color="#5274cf"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#eef0f4"/><stop offset="1" stop-color="#c9cdd4"/></linearGradient>
 <marker id="gpsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ba835e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
 text {font-family:Arial,Helvetica,sans-serif;fill:#737c8c;font-size:36px}
 .device {fill:#303640}
 .label {font-weight:600}
 .link {fill:none;stroke:#969da7;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
</style>
<!-- Wired links -->
<path class="link" d="M275 615 H770 V760"/>
<path class="link" d="M1110 760 V535 H1230"/>
<path class="link" d="M888 875 V1100 H728"/>
