  <rect x="-91" y="-12" width="63" height="24"/><rect x="28" y="-12" width="63" height="24"/>
  <path d="M-77 -12 V12 M-62 -12 V12 M-47 -12 V12 M43 -12 V12 M58 -12 V12 M73 -12 V12"/>
 </g>
 <rect x="-19" y="-20" width="38" height="40" rx="4" fill="#e4bd42" stroke="#c5a13a" stroke-width="2"/>
</g>
<text class="label" x="480" y="312">GPS satellite</text>
<path d="M438 268 L326 397" fill="none" stroke="#ba835e" stroke-width="4" stroke-dasharray="10 14" stroke-linecap="round" marker-end="url(#gpsArrow)"/>
<!-- GPS antenna -->
